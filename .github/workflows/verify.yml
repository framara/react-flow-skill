name: Verify skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install verification dependencies
        run: npm ci --prefix verification --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: verification/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify documentation, examples and evaluation harness
        run: npm test --prefix verification
      - name: Save screenshots, traces and reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verification-artifacts
          path: verification/artifacts/
          if-no-files-found: ignore
          retention-days: 7
